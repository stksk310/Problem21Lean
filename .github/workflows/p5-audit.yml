name: P21 Lean P5 Audit
on:
  push:
    branches: [p5-path-exclusion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install Lean
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Dependency cache
        run: lake exe cache get || true
      - name: Verify candidate digest
        run: sha256sum --check ci/P5_CANDIDATE_SHA256.txt
      - name: Fresh P5 and frozen regressions
        run: python3 verification/p5/verify.py
      - name: Upload TRUE AUDIT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P21_P5_TRUE_AUDIT_EVIDENCE
          path: audit-evidence/p5/
          if-no-files-found: error
          retention-days: 90
