name: P21 Lean C10 Audit
on:
  push:
    branches: [c10-chain-euclidean-closure]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install Lean
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Dependency cache
        run: lake exe cache get || true
      - name: Full C10 verification and regressions
        shell: pwsh
        run: ./verification/c10/verify.ps1
      - name: Upload C10 audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P21_C10_TRUE_AUDIT_EVIDENCE
          path: |
            verification/c10/REPORT.md
            verification/c10/SOURCE_INTEGRITY_SHA256.json
            verification/c10/FROZEN_INPUT_SHA256.json
          if-no-files-found: error
          retention-days: 90
