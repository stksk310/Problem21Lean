name: P21 Lean M3B2 Audit
on:
  push:
    branches: [m3b2-dpe-box-positive-exit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Exact M3B2 candidate / fresh Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout exact source and frozen history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize evidence
        run: python3 ci/m3b2_audit.py init
      - name: Verify frozen mathematical source
        run: python3 ci/m3b2_audit.py integrity
      - name: Verify candidate ZIP and digest
        run: python3 ci/m3b2_audit.py candidate
      - name: Install pinned elan and Lean
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$RUNNER_TEMP/p21-m3b2-elan"
          mkdir -p "$RUNNER_TEMP/p21-m3b2-installer"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/p21-m3b2-installer/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/p21-m3b2-installer/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/p21-m3b2-installer/elan.tar.gz" -C "$RUNNER_TEMP/p21-m3b2-installer"
          "$RUNNER_TEMP/p21-m3b2-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$(tr -d '\r\n' < lean-toolchain)"
      - name: Record environment
        run: python3 ci/m3b2_audit.py environment
      - name: Pinned third-party cache only
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/m3b2_audit.py cache-modules > audit-evidence/m3b2/DEPENDENCY_CACHE_MODULES.txt
          mapfile -t modules < audit-evidence/m3b2/DEPENDENCY_CACHE_MODULES.txt
          lake exe cache get "${modules[@]}" 2>&1 | tee audit-evidence/m3b2/DEPENDENCY_CACHE_LOG.txt || true
      - name: Check pinned dependencies
        run: python3 ci/m3b2_audit.py dependencies
      - name: Fresh root and complete M3B2 audit
        run: python3 ci/m3b2_audit.py verify
      - name: M1 through M3B1 isolated regressions
        run: python3 ci/m3b2_audit.py suite
      - name: Recheck frozen source
        if: always()
        run: python3 ci/m3b2_audit.py integrity
      - name: Require all evidence gates
        run: python3 ci/m3b2_audit.py complete
      - name: Upload inspectable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P21_M3B2_TRUE_AUDIT_EVIDENCE
          path: audit-evidence/m3b2/
          if-no-files-found: error
          retention-days: 90
