name: P21 Lean M2A Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # M2B preserves the frozen sources and reruns the original M2A verifier in its own job.
    if: github.ref_name != 'm2b-std-sym-glue' && github.head_ref != 'm2b-std-sym-glue' && github.ref_name != 'm3-nonsym-g4' && github.head_ref != 'm3-nonsym-g4' && github.ref_name != 'm3b1-minbox-white' && github.head_ref != 'm3b1-minbox-white'
    name: Exact M2A candidate / fresh Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout exact audit commit and frozen M1 history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize evidence
        run: python3 ci/m2a_audit.py init

      - name: Verify candidate ZIP, frozen M1 Git blobs and exact M2 sources
        run: python3 ci/m2a_audit.py integrity

      - name: Install pinned elan and candidate Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$RUNNER_TEMP/p21-m2a-elan"
          test ! -e "$ELAN_HOME"
          mkdir -p "$RUNNER_TEMP/p21-m2a-installer"
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/p21-m2a-installer/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/p21-m2a-installer/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/p21-m2a-installer/elan.tar.gz" -C "$RUNNER_TEMP/p21-m2a-installer"
          "$RUNNER_TEMP/p21-m2a-installer/elan-init" -y --no-modify-path --default-toolchain none
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          "$ELAN_HOME/bin/elan" toolchain install "$toolchain"

      - name: Record clean environment
        run: python3 ci/m2a_audit.py environment

      - name: Pinned third-party binary cache only
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/m2a_audit.py cache-modules > audit-evidence/m2a/DEPENDENCY_CACHE_MODULES.txt
          mapfile -t modules < audit-evidence/m2a/DEPENDENCY_CACHE_MODULES.txt
          if lake exe cache get "${modules[@]}" 2>&1 | tee audit-evidence/m2a/DEPENDENCY_CACHE_LOG.txt; then
            echo 'Third-party cache obtained; no project cache restored.' >> audit-evidence/m2a/DEPENDENCY_CACHE_LOG.txt
          else
            echo 'Optional cache unavailable; mandatory builds must compile missing pinned dependencies.' >> audit-evidence/m2a/DEPENDENCY_CACHE_LOG.txt
          fi

      - name: Verify dependency revisions
        run: python3 ci/m2a_audit.py dependencies

      - name: Fresh root lake build
        run: python3 ci/m2a_audit.py build-root

      - name: Explicit build of every candidate M2 module
        run: python3 ci/m2a_audit.py build-m2

      - name: Candidate lexical proof-debt scan and escape-hatch inspection
        run: python3 ci/m2a_audit.py debt

      - name: Original scanner regressions and CI integrity tests
        run: python3 ci/m2a_audit.py scanner-tests

      - name: Original M2 axiom checker
        run: python3 ci/m2a_audit.py axioms

      - name: Unmodified original M2 verifier in a separate fresh source copy
        run: python3 ci/m2a_audit.py suite

      - name: Critical Lean statements and M2A scope
        run: python3 ci/m2a_audit.py scope

      - name: Final M1 and M2 source integrity
        if: always()
        run: python3 ci/m2a_audit.py integrity

      - name: Final pinned dependency integrity
        if: always()
        run: python3 ci/m2a_audit.py dependencies

      - name: Require complete evidence
        run: python3 ci/m2a_audit.py complete

      - name: Upload independently inspectable audit evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P21_M2A_TRUE_AUDIT_EVIDENCE
          path: audit-evidence/m2a/
          if-no-files-found: error
          retention-days: 90
